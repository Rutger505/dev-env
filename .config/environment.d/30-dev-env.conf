# Static copy of shell/env.sh for systemd user services, which never run a
# shell. Keep the two in sync. environment.d has no globs or conditionals, so
# the ESP toolchain variables (versioned directories) only exist in env.sh.
# The zsh-only history variables stay out of here: bash reads HISTFILE too.

ZDOTDIR=${XDG_CONFIG_HOME}/zsh
DEV_ENV_ERROR_FILE=${XDG_STATE_HOME}/dev-env-sync-error

NPM_CONFIG_USERCONFIG=${XDG_CONFIG_HOME}/npm/npmrc
DOCKER_CONFIG=${XDG_CONFIG_HOME}/docker
OMNISHARPHOME=${XDG_CONFIG_HOME}/omnisharp

NVM_DIR=${XDG_DATA_HOME}/nvm
CARGO_HOME=${XDG_DATA_HOME}/cargo
RUSTUP_HOME=${XDG_DATA_HOME}/rustup
PNPM_HOME=${XDG_DATA_HOME}/pnpm
BUN_INSTALL=${XDG_DATA_HOME}/.bun
W3M_DIR=${XDG_DATA_HOME}/w3m
GRADLE_USER_HOME=${XDG_DATA_HOME}/gradle
DOTNET_CLI_HOME=${XDG_DATA_HOME}/dotnet
ANDROID_USER_HOME=${XDG_DATA_HOME}/android
PLATFORMIO_CORE_DIR=${XDG_DATA_HOME}/platformio
GNUPGHOME=${XDG_DATA_HOME}/gnupg
VCPKG_ROOT=${XDG_DATA_HOME}/vcpkg

KUBECONFIG=${HOME}/.kube/config

FONTCONFIG_PATH=/etc/fonts/
FONTCONFIG_FILE=/etc/fonts/fonts.conf

EDITOR=nvim
VISUAL=nvim
PAGER=less

PATH=${PATH}:${HOME}/.local/bin:${DEV_ENV}/scripts:${VCPKG_ROOT}:${PLATFORMIO_CORE_DIR}/penv/bin
PATH=${CARGO_HOME}/bin:/usr/libexec/imv:${XDG_DATA_HOME}/opencode/bin:${BUN_INSTALL}/bin:${PNPM_HOME}:${XDG_DATA_HOME}/JetBrains/Toolbox/scripts:${PATH}
PATH=${XDG_DATA_HOME}/esp-tools/bin:${HOME}/miniforge3/bin:${PATH}
